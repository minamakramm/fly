<!DOCTYPE html>\n<html lang="en">\n  <head>\n    <meta charset="UTF-8" />\n    <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n    <title>Capstone Settings</title>\n    <link rel="stylesheet" href="styles.css" />\n  </head>\n  <body>\n    <main>\n      <h1>Capstone Settings</h1>\n      <form id="settings-form" novalidate>\n        <p>Update your profile settings for the capstone project.</p>\n        <div class="field">\n          <label for="displayName">Display name</label>\n          <input id="displayName" name="displayName" type="text" />\n          <p class="error" data-error-for="displayName"></p>\n        </div>\n        <div class="field">\n          <label for="emailNotifications">Email notifications</label>\n          <select id="emailNotifications" name="emailNotifications">\n            <option value="daily">Daily summary</option>\n            <option value="weekly">Weekly digest</option>\n            <option value="never">Never</option>\n          </select>\n          <p class="error" data-error-for="emailNotifications"></p>\n        </div>\n        <button type="submit">Save settings</button>\n        <p id="form-message" role="status"></p>\n      </form>\n    </main>\n\n    <script type="module" src="settings.js"></script>\n  </body>\n</html>
